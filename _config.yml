# ---------------- #
#   Main Configs   #
# ---------------- #
baseurl:
url: https://JKWrist.github.io
date_format: "ordinal"
title: "JKWrist's Blog"
subtitle: "徐钧泽"
description: "Junze Xu 的个人博客，记录 Linux、C/C++、OpenSSL、Makefile 等技术笔记与开发心得"
keywords: Linux, C++, OpenSSL, Makefile, 系统编程, 面试笔记, 技术博客
timezone: Asia/Shenzhen
encoding: "utf-8"
side_bar_repo_limit: 5

# ---------------- #
#      Author      #
# ---------------- #
author: Junze Xu
organization: 
organization_url: 
github_username: JKWrist
location: ShenZhen, China
email: b179455659@gmail.com

# ---------------- #
#    Navigation    #
# ---------------- #
navs:
  -
    href: /
    label: 首页

  -
    href: /categories/
    label: 分类

#   -
#     href: /archives/
#     label: 归档

  -
    href: /wiki/
    label: 维基

  -
    href: /links/
    label: 链接

  -
    href: /about/
    label: 关于

# ---------------- #
#       RSS        #
# ---------------- #
subscribe_rss: /feed.xml

# ---------------- #
#      Jekyll      #
# ---------------- #
markdown: kramdown
kramdown:
    input: GFM
highlighter: rouge
paginate: 10
lsi: false
quiet: false
excerpt_separator: "\n\n"
permalink: /:year/:month/:day/:title/
plugins:
    - jekyll-github-metadata
    - rouge
#     - jekyll-html-pipeline
    - jekyll-paginate
    - jekyll-sitemap
    - jekyll-feed
    - jemoji
#     - jekyll-mentions
collections:
    wiki:
        output: true
        permalink: /wiki/:path/

repository: JKWrist/JKWrist.github.io

# ---------------- #
#      Comments    #
# ---------------- #
comments_provider: gitalk

gitalk:
  enable: true #用来做启用判断可以不用
  owner: JKWrist
  repo: blog-comments
  clientID: 152675ab0a251d676e6d
  clientSecret: ENV_GITALK_CLIENT_SECRET # 请通过环境变量注入，切勿明文写入仓库
  
#gitalk:
#    owner: JKWrist
#    repo: blog-comments
#    clientID: 152675ab0a251d676e6d
#    clientSecret: REDACTED_SECRET

# 在使用其它评论组件时可点击显示 Disqus
#lazy_load_disqus : false

# ---------------- #
#      Search      #
# ---------------- #
simple_jekyll_search:
    # 是否支持全文搜索
    fulltext: false
    # 最多显示多少条搜索结果
    limit: 10

# ---------------- #
#    Analytics     #
# ---------------- #
google:
    analytics_id: 
