---
layout: default
---

<section class="section">
  <div class="container" style="max-width: 750px;">
    <header class="section-header" style="text-align: left; margin-bottom: 2rem;">
      {% if page.title %}
      <h1 style="font-size: 2rem; font-weight: 800;">{{ page.title }}</h1>
      {% endif %}
      {% if page.subtitle %}
      <p style="color: var(--text-secondary); margin-top: 0.75rem;">{{ page.subtitle }}</p>
      {% endif %}
    </header>
    <div class="article-content markdown-body" style="color: var(--text-secondary);">
      {{ content }}
    </div>
    {% if page.comments != false %}
    <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border);">
      {% include comments.html %}
    </div>
    {% endif %}
  </div>
</section>
