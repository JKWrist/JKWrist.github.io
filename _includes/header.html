<header class="site-header">
  <div class="container">
    <a href="{{ '/' | relative_url }}" class="site-logo">{{ site.title }}</a>
    <nav>
      <ul class="site-nav">
        {% for nav in site.navs %}
        <li><a href="{{ nav.href | relative_url }}" class="{% if page.menu == nav.label %}active{% endif %}">{{ nav.label }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
